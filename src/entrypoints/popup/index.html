<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oggy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      padding: 16px;
      background: #fafafa;
      color: #1a1a1a;
    }
    h1 { font-size: 18px; margin-bottom: 4px; }
    .tagline { font-size: 11px; color: #666; margin-bottom: 12px; }
    .origin { font-size: 12px; color: #444; margin-bottom: 12px; word-break: break-all; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    button {
      padding: 6px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #f0f0f0; }
    button[aria-pressed="true"] { background: #e53e3e; color: #fff; border-color: #e53e3e; }
    .stat { font-size: 12px; color: #666; }
    .stat strong { color: #1a1a1a; }
    .footer { margin-top: 12px; }
    .footer button { font-size: 12px; }
  </style>
</head>
<body data-testid="oggy-popup">
  <h1>🐾 Oggy</h1>
  <p class="tagline">Teaching AI to use a website, one step at a time!</p>
  <p class="origin" data-testid="oggy-origin-label">Loading…</p>
  <div class="controls">
    <button data-testid="oggy-record-toggle" aria-pressed="false">⏺ Record</button>
    <button data-testid="oggy-mcp-toggle" aria-pressed="false" disabled>MCP: OFF</button>
  </div>
  <p class="stat">Tools: <strong data-testid="oggy-tool-count">0</strong></p>
  <div class="footer">
    <button data-testid="oggy-open-sidepanel">Open Side Panel</button>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
