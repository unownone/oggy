name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_call:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v0.1.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          tag="${tag#refs/tags/}"
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Refusing to release non-version tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version from tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build Chrome extension
        run: npm run build

      - name: Zip Chrome extension
        run: npm run zip

      - name: Stage release assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp ".output/oggy-${VERSION}-chrome.zip" "artifacts/oggy-${VERSION}-chrome.zip"
          cp ".output/oggy-${VERSION}-chrome.zip" artifacts/oggy-chrome.zip

      - name: Upload zipped Chrome MV3 build
        uses: actions/upload-artifact@v4
        with:
          name: oggy-chrome-mv3-zip
          path: artifacts/oggy-chrome.zip
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "$TAG" \
            "artifacts/oggy-${VERSION}-chrome.zip" \
            --title "$TAG" \
            --generate-notes
